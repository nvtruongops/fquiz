name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JWT_SECRET: "test-jwt-secret-key-min-32-chars-long-security"
  JWT_SECRET_PREV: "test-jwt-secret-key-min-32-chars-long-prev"
  MONGODB_URI: "mongodb://localhost:27017/fquiz_test"
  CI: "true"
  NODE_ENV: "test"

jobs:
  ci:
    name: Verification & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Rule Engine Verification (Strict Mode)
        run: node .agents/scripts/verify.js --strict

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Create Test Results Directory
        run: mkdir -p test-results

      - name: Run Unit Tests
        run: npm test -- --forceExit

      - name: Cache Next.js Build Artifacts
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build Next.js Application
        run: npm run build


