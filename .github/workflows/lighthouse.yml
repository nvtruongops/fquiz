name: "Lighthouse CI Performance Audit"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  JWT_SECRET: "test-jwt-secret-key-min-32-chars-long-security"
  JWT_SECRET_PREV: "test-jwt-secret-key-min-32-chars-long-prev"
  MONGODB_URI: "mongodb://localhost:27017/fquiz_test"

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js Application
        run: npm run build

      - name: Audit Performance & A11y with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

